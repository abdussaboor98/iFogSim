        downlinkBandwidth: 8000
        ratePerMips: 0.0
  cloud:
    capacity:
      # Central fallback capacity (treated as abundant bandwidth by default)
      cpuMips: 12000
      ramMb: 65536
      bandwidth: 60000
      storageMb: 200000
      uplinkBandwidth: 60000
      downlinkBandwidth: 60000
      ratePerMips: 0.0
  edge:
    # Number of edge devices attached to each fog node
    devicesPerFog: 6
    latencyMs: 2
    bandwidthMbps: 2000
    heterogeneityJitter: 10

network:
  # Favor fog-to-fog over fog-to-cloud by making WAN slower
  interFogLatencyMs: 3
  interFogBandwidthMbps: 12000
  fogCloudLatencyMs: 40
  fogCloudBandwidthMbps: 3000
