simulation:
  # mode: 1 (distributed gossip+bidding) or 2 (centralized cloud scheduler)
  # Use mode 2 so the cloud is only used when fog resources are infeasible.
  mode: 1
  # RNG seed to keep experiments reproducible
  seed: 42
  # Simulation end time in seconds
  durationSeconds: 3600

gossip:
  enabled: true
  # Period between gossip rounds (seconds)
  intervalSeconds: 10
  # Entries older than this many intervals are ignored
  stalenessThresholdIntervals: 7

fault:
  # Prediction horizon Δ before failure occurs
  predictionLeadSeconds: 60
  # Mean time between failures (seconds) for Poisson process
  meanTimeBetweenFailureSeconds: 60
  # Do not start injecting faults until this offset (seconds)
  startDelaySeconds: 60
  # Time until a failed server recovers (seconds)
  recoverySeconds: 300
  # Fault type probabilities (must sum to ~1.0)
  cpuFailureProb: 0.33
  bandwidthDegradationProb: 0.34
  serverCrashProb: 0.33

bidding:
  # Maximum number of fog bidders to invite (set 0 for no cap)
  maxFogBidders: 4
  # Pause/resume overhead for migration time
  pauseSeconds: 1.0
  resumeSeconds: 1.0
  # k for bid_value = migrationTime + k * resourceImpact
  resourceImpactK: 0.5

trust:
  enableTrust: false
  trustDecayFactor: 0.5
  trustRecoveryFactor: 0.05
  trustThreshold: 0.5
  tauBw: 0.2
  tauMig: 5.0

sla:
  epsilon: 0.001
  urgencyK: 0.1
  resourceWeight: 0.6
  urgencyWeight: 0.4
  penaltyEta: 1.0

task:
  # Number of tasks each edge emits (total per edge)
  # Set to 0 to keep emitting tasks continuously for the whole simulation
  tasksPerEdge: 10
  # Mean inter-arrival time (seconds) for exponential arrivals
  meanInterArrivalSeconds: 200
  jitterPercent: 20
  defaultProfile:
    # Desired runtime and CPU share; total work is runtimeSeconds * demandMips
    runtimeSeconds: 300
    demandMips: 800
    # RAM demand in MB
    ramMb: 256
    # Bandwidth demand in Mbps
    bandwidth: 400
    # Image+state size in MB
    containerSizeMb: 150
  # Ranges for workload variability
  runtimeRange:
    min: 240
    max: 360
  demandMipsRange:
    min: 360
    max: 900
  ramRange:
    min: 192
    max: 512
  bandwidthRange:
    min: 200
    max: 600
  containerSizeRange:
    min: 100
    max: 200
  slaRuntimeMultiplier: 1.2

topology:
  fogNodes:
    # Define 6 fog nodes; adjust counts or capacities as needed.
    - name: fog-1
      servers: 2
      capacityMultiplier: 1
      serverCapacity:
        cpuMips: 2000
        ramMb: 4096
        bandwidth: 4000
        storageMb: 100000
        uplinkBandwidth: 8000
        downlinkBandwidth: 8000
        ratePerMips: 0.0
