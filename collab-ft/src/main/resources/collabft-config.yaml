simulation:
  mode: 1
  seed: 42
  durationSeconds: 3600      # 10 hours

metrics:
  perTaskCsv: true

gossip:
  enabled: true
  intervalSeconds: 7
  stalenessThresholdIntervals: 3

fault:
  predictionLeadSeconds: 120          # Enough time to allow some local recovery, but not trivial
  meanTimeBetweenFailureSeconds: 200  # Fewer overlapping faults → reduces excessive local_infeasible
  startDelaySeconds: 90
  recoverySeconds: 210               # Recovery still meaningful under load
  cpuFailureProb: 0.33
  bandwidthDegradationProb: 0.34
  serverCrashProb: 0.33

bidding:
  maxFogBidders: 4
  pauseSeconds: 1.5
  resumeSeconds: 1.5
  resourceImpactK: 0.6
  bidTimeoutSeconds: 30

trust:
  enableTrust: true
  trustDecayFactor: 0.5
  trustRecoveryFactor: 0.05
  trustThreshold: 0.5
  tauBw: 0.3
  tauMig: 0.5
  tauSla: 0.3
  slaSuccessBonus: 0.02
  slaViolationPenalty: 0.10
  paymentPenaltyLambda: 0.25  # λ controls dishonesty penalties: P_lie = λ(e_bw + e_mig)
  paymentPenaltyMu: 0.10      # μ controls SLA penalties: P_sla = μ·max(0, -m_sla)
  passiveRecoveryRate: 0.01   # 1-3% of distance to 1.0
  passiveRecoveryInterval: 21  # Every gossip cycle × 3 (7s × 3 = 21s)

sla:
  slackRatio: 0.06                # A bit more realistic than 0.02; reduces excessive misses
  netOverheadRatio: 0.04

task:
  tasksPerEdge: 25               # Enough load but not extreme
  meanInterArrivalSeconds: 160    # Balanced inflow; avoids 541 local-infeasible
  jitterPercent: 20
  defaultProfile:
    runtimeSeconds: 260
    demandMips: 700
    ramMb: 256
    bandwidth: 300
    containerSizeMb: 240
  runtimeRange:
    min: 240
    max: 400
  demandMipsRange:
    min: 200
    max: 600
  ramRange:
    min: 128
    max: 512
  bandwidthRange:
    min: 150
    max: 550
  containerSizeRange:
    min: 200
    max: 420
  slaRuntimeMultiplier: 1.2

topology:
  fogNodes:
    - name: fog-1
      servers: 4
      edgeDevices: 4
      capacityMultiplier: 1
      serverCapacity:
        cpuMips: 2000
        ramMb: 4096
        bandwidth: 3500
        storageMb: 100000
        uplinkBandwidth: 6000
        downlinkBandwidth: 6000
        ratePerMips: 0.0
